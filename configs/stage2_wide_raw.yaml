seed: 42
epochs: 30
batch_size: 64
learning_rate: 0.001
weight_decay: 0.0001
width: 64
blocks_per_stage: 2
normalization_epsilon: 0.000001
ece_bins: 15
load_workers: 8
cpu_threads: 4
amp: true
exclude_unlabeled: true
standardize: false
device: cuda
validation_auc_review_threshold: 0.88
sensitivity_role: side_column
agreement_class: CD
agreement_rule: interval_excludes_zero_and_same_sign_as_locked_contrast
